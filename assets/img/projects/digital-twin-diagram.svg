<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="450" fill="#0a121c"/>

  <!-- Three stacked layers: sensors, data fusion, digital twin -->
  <g font-family="Georgia, serif" font-size="16" fill="#9a9587">

    <!-- Layer 1: sensors -->
    <rect x="150" y="90" width="500" height="70" rx="6" fill="none" stroke="#9a9587" stroke-width="2"/>
    <circle cx="190" cy="125" r="6" fill="#b5651d"/>
    <circle cx="230" cy="125" r="6" fill="#b5651d"/>
    <circle cx="270" cy="125" r="6" fill="#b5651d"/>
    <circle cx="310" cy="125" r="6" fill="#b5651d"/>
    <text x="360" y="130">Sensing layer (IoT)</text>

    <!-- Arrow -->
    <line x1="400" y1="160" x2="400" y2="200" stroke="#b5651d" stroke-width="2"/>
    <polygon points="400,208 393,196 407,196" fill="#b5651d"/>

    <!-- Layer 2: data fusion -->
    <rect x="150" y="210" width="500" height="70" rx="6" fill="none" stroke="#9a9587" stroke-width="2"/>
    <text x="220" y="250">Data capture &amp; fusion layer</text>

    <!-- Arrow -->
    <line x1="400" y1="280" x2="400" y2="320" stroke="#b5651d" stroke-width="2"/>
    <polygon points="400,328 393,316 407,316" fill="#b5651d"/>

    <!-- Layer 3: digital twin -->
    <rect x="150" y="330" width="500" height="70" rx="6" fill="none" stroke="#f2efe6" stroke-width="2"/>
    <text x="270" y="370" fill="#f2efe6">Port digital twin</text>
  </g>
</svg>
