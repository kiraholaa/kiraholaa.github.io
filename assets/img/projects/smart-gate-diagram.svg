<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="450" fill="#0a121c"/>

  <!-- Gate posts -->
  <rect x="180" y="120" width="18" height="260" fill="#9a9587" opacity="0.5"/>
  <rect x="602" y="120" width="18" height="260" fill="#9a9587" opacity="0.5"/>
  <rect x="180" y="120" width="440" height="14" fill="#9a9587" opacity="0.5"/>

  <!-- Truck (simple silhouette) -->
  <g transform="translate(300,260)">
    <rect x="0" y="0" width="120" height="55" rx="4" fill="none" stroke="#f2efe6" stroke-width="3"/>
    <rect x="120" y="18" width="55" height="37" rx="4" fill="none" stroke="#f2efe6" stroke-width="3"/>
    <circle cx="35" cy="60" r="12" fill="none" stroke="#f2efe6" stroke-width="3"/>
    <circle cx="150" cy="60" r="12" fill="none" stroke="#f2efe6" stroke-width="3"/>
  </g>

  <!-- Sensor beams from gate to truck -->
  <line x1="199" y1="150" x2="330" y2="255" stroke="#b5651d" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="611" y1="150" x2="480" y2="255" stroke="#b5651d" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Small interpretable-AI node graph, top right -->
  <g transform="translate(600,60)" stroke="#b5651d" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="7" fill="#b5651d"/>
    <circle cx="45" cy="-20" r="7" fill="#b5651d"/>
    <circle cx="45" cy="20" r="7" fill="#b5651d"/>
    <circle cx="90" cy="0" r="7" fill="#b5651d"/>
    <line x1="0" y1="0" x2="45" y2="-20"/>
    <line x1="0" y1="0" x2="45" y2="20"/>
    <line x1="45" y1="-20" x2="90" y2="0"/>
    <line x1="45" y1="20" x2="90" y2="0"/>
  </g>

  <text x="400" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#9a9587">
    Smart gate coordination — interpretable AI
  </text>
</svg>
