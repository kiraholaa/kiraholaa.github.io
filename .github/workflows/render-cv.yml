name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          # requirements.txt pins rendercv[full]==1.18: _data/cv.yml (and the al_folio_cv
          # gem's Liquid CV page, which reads cv.label/cv.address.*/cv.image directly) use
          # RenderCV's older data schema. The current rendercv (2.x) renamed/removed those
          # fields and its `--settings <file>` flag expects a v2.x-shaped settings file, which
          # `assets/rendercv/settings.yaml` (also v2.x-shaped) isn't valid input for v1.18 —
          # confirmed locally, hence no --settings/--design here. See requirements.txt.
          cv_file=$(find _data -maxdepth 1 -type f \( -name "cv.yaml" -o -name "cv.yml" \))
          if [ -z "$cv_file" ]; then
            echo "No cv.yml file found!"
            exit 1
          fi
          # Must match _pages/cv.md's cv_pdf front matter — update both together.
          pdf_path="assets/rendercv/rendercv_output/Kaleb_Irahola-Azad_CV.pdf"
          rendercv render "$cv_file" --pdf-path "$pdf_path" --dont-generate-markdown --dont-generate-png
          # v1.18 has no --output-folder equivalent, so it always also writes the LaTeX
          # build (.tex/.log/.aux/__pycache__) to a default ./rendercv_output/ next to the
          # repo root — clean that up, the real PDF is already at $pdf_path.
          rm -rf rendercv_output
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: render the latest CV"
          git push
